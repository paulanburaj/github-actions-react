name: Pipeline-actions
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, edited, reopened]
jobs:
    test-repo:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: install node
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: install dependencies
              run: npm ci
            - name: run tests
              run: npm test
    deploy:
        runs-on: ubuntu-latest
        needs: test-repo
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: install node
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: install dependencies
              run: npm ci
            - name: deploy to server
              run: echo "Deploying to server..."